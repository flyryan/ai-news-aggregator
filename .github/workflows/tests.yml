name: Tests

# Fast guard checks on every push/PR. Intentionally dependency-light: the
# call_with_thinking signature guard is stdlib-only (ast), so it runs without
# installing the project or any secrets/network. This is what turns a silent
# prod break (like the 2026-06-21 call_with_thinking overload drift that took
# the daily pipeline RED) into a red check before it can merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Signature lockstep guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: call_with_thinking signature lockstep
        run: python3 -m unittest tests.call_with_thinking_signature_test -v
      - name: Deploy webhook requires authenticated caller (CWE-306 #1247)
        run: python3 -m unittest tests.webhook_hook_auth_test -v
      - name: Topic-detection JSON extraction survives fences/preambles (2026-07-09)
        run: python3 -m unittest tests.extract_json_str_test -v
      - name: No unverified reset to a remote ref (CWE-345, 2026-07-29)
        run: python3 -m unittest tests.deploy_signature_gate_test -v
      - name: Source anomaly detector finds the known outages (2026-07-29)
        run: python3 -m unittest tests.source_anomaly_test -v
      - name: Privileged-action path is not widenable (sudoers/wrapper/units)
        run: python3 -m unittest tests.admin_actions_test -v
      - name: Preview cannot silently render live data (data-base resolver)
        run: python3 -m unittest tests.preview_base_test -v
      - name: Preview job ids, unit paths, and allowlists stay in lockstep
        run: python3 -m unittest tests.preview_wiring_test -v
      - name: Replay publish gate catches keys, not kebab-case (2026-07-31)
        run: python3 -m unittest tests.replay_secret_guard_test -v
      - name: LessWrong browser proxy scheme is Chromium-legal (2026-08-05..08 outage)
        run: python3 -m unittest tests.lesswrong_proxy_scheme_test -v
      - name: arXiv OAI retries, bounds, and admits partial harvests (2026-08-17 outage)
        run: python3 -m unittest tests.arxiv_oai_resilience_test -v
      - name: Replay source steps are measured, keyed right, never invented (2026-08-17)
        run: python3 -m unittest tests.replay_steps_test -v
      # A --resume-from run replayed checkpoint-loaded phases as correctly-sized
      # but EMPTY windows: the recorder is memory-only, so the analyzers that
      # ran in the checkpointed process vanished from the cast (2026-08-24).
      - name: Resumed runs keep the agents that ran in the checkpointed process
        run: python3 -m unittest tests.replay_restored_calls_test -v

  content-rendering:
    name: Content rendering guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 2026-08-08: a LessWrong card rendered as an unreadable wall of text —
    # `re.sub(r'<[^>]+>', '', html)` deleted block tags without replacing them,
    # welding "TL;DR" onto the next paragraph, and the bold regex ate the
    # significance marker in "(***)" as formatting. Also pins the bold/code
    # patterns equal across json_generator.py and markdown.ts, which
    # re-implements them for the client-side fallback path.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps for html_text and json_generator imports
        run: python3 -m pip install --no-input "beautifulsoup4>=4.12" "nh3>=0.2"
      - name: Block structure, asterisk markers, and backend/frontend lockstep
        run: python3 -m unittest tests.content_rendering_test -v

  hero-retry:
    name: Hero image retry-window guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Guards the daily hero image retry window. On 2026-06-26 a single provider
    # disconnect dropped the hero (no retry); on 2026-06-27 the 3-attempt/~25s
    # window was too shallow and the hero dropped AGAIN even though a manual
    # regen minutes later succeeded. This test locks in the multi-minute retry
    # window + transient-failure handling so neither regression can silently
    # return. Needs the three deps image_client imports at module load.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps for image_client import
        run: python3 -m pip install --no-input "httpx>=0.27.0" "google-genai>=1.0.0" "Pillow>=10.0.0"
      - name: Hero image retry behavior
        run: python3 -m unittest tests.image_client_retry_test -v

  admin-auth:
    name: Admin panel Access-JWT verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The admin panel holds a GitHub PAT and can dispatch ~$8-11 pipeline runs.
    # An earlier version of this service authenticated on header PRESENCE, so
    # `curl -H 'cf-access-authenticated-user-email: x'` was a full admin session
    # and the audit log recorded whatever identity the caller typed. This job
    # fails the build if that class of bug returns.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps for JWT verification
        run: python3 -m pip install --no-input "PyJWT[crypto]>=2.9" "fastapi>=0.115"
      - name: Access-JWT verification rejects forged, expired, and mis-scoped tokens
        run: python3 -m unittest tests.admin_auth_test -v

  pipeline-contracts:
    name: Lookback window + partial-spend billing guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # LOOKBACK_HOURS must bound the collection window (it once threaded through
    # every gatherer and was never read), and calls that fail mid-stream must
    # still be billed for the tokens they already emitted (2026-07-28: five
    # batches died after ~140k chars and none of it reached the cost report).
    # Both tests are stdlib unittest but import agents.base / agents.llm_client,
    # which need httpx, anthropic, and pydantic at module load.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # `agents/__init__.py` eagerly imports the whole pipeline -- gatherers and
      # analyzers included -- so importing even `agents.base` pulls feedparser,
      # requests, dateutil, bs4, yaml and aiohttp with it. The old three-package
      # list was therefore never sufficient: this job failed on its FIRST step
      # (ModuleNotFoundError: feedparser) and silently skipped every step behind
      # it, so its guards had not actually run since 2026-08-15.
      - name: Install minimal deps for agents.base / llm_client imports
        run: |
          python3 -m pip install --no-input \
            "httpx>=0.27.0" "anthropic>=0.75,<1.0" "pydantic>=2.0" \
            "feedparser>=6.0" "requests>=2.31" "python-dateutil>=2.8" \
            "beautifulsoup4>=4.12" "PyYAML>=6.0" "aiohttp>=3.9"
      - name: LOOKBACK_HOURS actually bounds the collection window
        run: python3 -m unittest tests.lookback_hours_test -v
      - name: Mid-stream failures are billed for what they streamed
        run: python3 -m unittest tests.partial_spend_capture_test -v
      # 2026-08-24: a provider rate-limit brownout 429'd 40 of 57 LLM calls.
      # The openai-chat path had no transport retry at all, a concurrency cap
      # was standing in for a rate limit, and the publish gate never looked at
      # category summaries -- so a report with four placeholder summaries was
      # signed, committed and published while every phase reported [ok].
      - name: 429s retry with backoff, are rate-limited, and cannot publish silently
        run: python3 -m unittest tests.llm_rate_limit_resilience_test -v
      # 2026-09-03: first run on meta/muse-spark-1.3-contributor. A model with
      # no row in the tracker is priced at Opus rates flagged as an estimate --
      # 50x this tier's real completion price, inverting the cost comparison
      # the test run exists to make.
      - name: Muse Spark tiers are priced as measurements, not estimates
        run: python3 -m unittest tests.muse_spark_pricing_test -v
