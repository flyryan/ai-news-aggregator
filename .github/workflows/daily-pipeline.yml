name: Daily Pipeline

on:
  schedule:
    # GitHub cron is UTC-only. These two entries cover 3 AM America/New_York
    # across daylight saving time; the ET gate below lets only the nominal
    # 3 AM run continue even when GitHub starts the runner late.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Report date to generate (YYYY-MM-DD). Defaults to today in ET."
        required: false
        type: string
      resume_from:
        description: "Optional pipeline phase to resume from, for manual recovery."
        required: false
        type: string
      anthropic_model:
        description: "Optional LLM model ID override for this run."
        required: false
        type: string
      commit_outputs:
        description: "Commit and push generated outputs after the run."
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-pipeline-${{ github.ref }}
  # Only a manual dispatch cancels an in-flight run, so a manual re-run
  # supersedes an overlapping scheduled run instead of double-publishing the
  # same day (see the 2026-07-08 double run). Scheduled runs must NOT cancel
  # each other: the two DST-backstop crons (0 7 / 0 8) intentionally overlap and
  # rely on the ET gate below to pick the nominal 3 AM run. A plain
  # `cancel-in-progress: true` would let the 8 AM UTC cron kill the still-running
  # 3 AM run, then gate itself out — publishing nothing.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  daily-pipeline:
    name: Generate and publish daily data
    if: github.repository == 'flyryan/ai-news-aggregator'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: America/New_York
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_API_BASE: ${{ secrets.ANTHROPIC_API_BASE }}
      ANTHROPIC_MODEL: ${{ inputs.anthropic_model || vars.ANTHROPIC_MODEL || 'claude-5-opus-aws' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
      SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
      SCRAPECREATORS_BASE: ${{ vars.SCRAPECREATORS_BASE || 'https://api.scrapecreators.com' }}
      REDDIT_PROXY_URL: ${{ secrets.REDDIT_PROXY_URL }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT || 'AI-News-Aggregator/1.0 (by u/flyryan)' }}
      LESSWRONG_PROXY_URL: ${{ secrets.LESSWRONG_PROXY_URL }}
      PIPELINE_PROXY_URL: ${{ secrets.PIPELINE_PROXY_URL }}
      MULLVAD_ACCOUNT: ${{ secrets.MULLVAD_ACCOUNT }}
      MULLVAD_WG_PRIVATE_KEY: ${{ secrets.MULLVAD_WG_PRIVATE_KEY }}
      MULLVAD_RELAY_FILTER: ${{ vars.MULLVAD_RELAY_FILTER || 'us' }}
      PIPELINE_BASE_URL: ${{ vars.PIPELINE_BASE_URL || 'https://news.aatf.ai' }}
      PIPELINE_COMMIT_PATHS: ${{ vars.PIPELINE_COMMIT_PATHS || 'web/data config/model_releases.yaml config/ecosystem_context.yaml' }}
      # `gemini-3-pro-image-preview` was retired from the endpoint and now 400s
      # ("Invalid model name"), which failed Phase 4.7 on 2026-07-28. The GA name
      # is the correct default; verify against /v1/models before changing it.
      PIPELINE_IMAGE_MODEL: ${{ vars.PIPELINE_IMAGE_MODEL || 'gemini-3-pro-image' }}
      LLM_TRUST_ENV_PROXY: ${{ vars.LLM_TRUST_ENV_PROXY || 'false' }}
      LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS || '240' }}
      # 2026-08-24: 16 in flight against OpenRouter's shared free-tier pool
      # produced ~40 req/s once 429s started fast-failing (each rejection freed
      # its slot in ~0.4s and relaunched), far above the published 20/min.
      # NOTE: a `max_concurrent_requests` set on a route in the providers secret
      # OVERRIDES this env default -- lower it there too, or this stays cosmetic.
      LLM_MAX_CONCURRENT_REQUESTS: ${{ vars.LLM_MAX_CONCURRENT_REQUESTS || '6' }}
      # A concurrency cap bounds in-flight requests, not request rate; the two
      # diverge exactly when a provider fast-fails. This bounds the rate itself.
      # No route in the providers secret sets `max_requests_per_minute` yet, so
      # this env value is what actually takes effect today.
      LLM_MAX_REQUESTS_PER_MINUTE: ${{ vars.LLM_MAX_REQUESTS_PER_MINUTE || '15' }}
      LLM_ADAPTIVE_MAX_TOKENS: ${{ vars.LLM_ADAPTIVE_MAX_TOKENS || '65536' }}
      # Note: only reaches the Anthropic SDK, so it does nothing on the
      # openai-chat (OpenRouter) path. Transport retries are LLM_RETRY_* below.
      LLM_MAX_RETRIES: ${{ vars.LLM_MAX_RETRIES || '2' }}
      LLM_RETRY_MAX_ATTEMPTS: ${{ vars.LLM_RETRY_MAX_ATTEMPTS || '6' }}
      LLM_RETRY_BASE_DELAY: ${{ vars.LLM_RETRY_BASE_DELAY || '5' }}
      LLM_RETRY_MAX_DELAY: ${{ vars.LLM_RETRY_MAX_DELAY || '90' }}
      # strict = refuse to publish a report whose category summaries are
      # missing/placeholder. Set to 'lenient' to ship a degraded day on purpose.
      PUBLISH_GATE: ${{ vars.PUBLISH_GATE || 'strict' }}
      LLM_LOG_REQUESTS: ${{ vars.LLM_LOG_REQUESTS || 'true' }}
      LLM_HEARTBEAT_SECONDS: ${{ vars.LLM_HEARTBEAT_SECONDS || '60' }}
      LLM_METRICS_PATH: ${{ vars.LLM_METRICS_PATH || 'data/llm_metrics.jsonl' }}
      ANALYZER_BATCH_SIZE: ${{ vars.ANALYZER_BATCH_SIZE || '75' }}
      ANALYZER_MAX_CONCURRENT_BATCHES: ${{ vars.ANALYZER_MAX_CONCURRENT_BATCHES || '8' }}
      TARGET_DATE_INPUT: ${{ inputs.target_date || '' }}
      RESUME_FROM_INPUT: ${{ inputs.resume_from || '' }}
      COMMIT_OUTPUTS: ${{ github.event_name != 'workflow_dispatch' || inputs.commit_outputs }}

    steps:
      - name: Check 3 AM ET schedule gate
        id: schedule_gate
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: bypassing ET schedule gate."
            exit 0
          fi

          if [[ -z "${SCHEDULE_CRON:-}" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled run is missing github.event.schedule; exiting as a no-op."
            exit 0
          fi

          nominal_info="$(
            python3 <<'PY'
          from datetime import datetime, timezone
          from os import environ
          from zoneinfo import ZoneInfo

          cron = environ["SCHEDULE_CRON"]
          parts = cron.split()
          if len(parts) < 2:
              raise SystemExit(f"Unsupported schedule expression: {cron!r}")

          minute = int(parts[0])
          hour = int(parts[1])
          et_today = datetime.now(ZoneInfo("America/New_York")).date()
          nominal_utc = datetime(
              et_today.year,
              et_today.month,
              et_today.day,
              hour,
              minute,
              tzinfo=timezone.utc,
          )
          nominal_et = nominal_utc.astimezone(ZoneInfo("America/New_York"))
          should_run = nominal_et.hour == 3 and nominal_et.minute == 0

          print(f"should_run={'true' if should_run else 'false'}")
          print(f"nominal_utc={nominal_utc.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print(f"nominal_et={nominal_et.strftime('%Y-%m-%d %H:%M:%S %Z')}")
          PY
          )"

          should_run="$(awk -F= '/^should_run=/{print $2}' <<< "$nominal_info")"
          nominal_utc="$(awk -F= '/^nominal_utc=/{print $2}' <<< "$nominal_info")"
          nominal_et="$(awk -F= '/^nominal_et=/{print $2}' <<< "$nominal_info")"
          actual_et="$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')"

          if [[ "$should_run" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled cron '$SCHEDULE_CRON' maps to $nominal_et ($nominal_utc); continuing."
            echo "Actual runner start time was $actual_et."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled cron '$SCHEDULE_CRON' maps to $nominal_et ($nominal_utc), not 3 AM ET; exiting as a no-op."
            echo "Actual runner start time was $actual_et."
          fi

      - name: Check out flyryan main
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_PUSH_TOKEN || github.token }}

      - name: Set up Python
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Write provider configuration
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        env:
          PIPELINE_PROVIDERS_YAML: ${{ secrets.PIPELINE_PROVIDERS_YAML }}
        run: |
          set -euo pipefail
          if [[ -n "${PIPELINE_PROVIDERS_YAML:-}" ]]; then
            printf '%s\n' "$PIPELINE_PROVIDERS_YAML" > config/providers.yaml
            echo "Wrote config/providers.yaml from PIPELINE_PROVIDERS_YAML."
          elif [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "ANTHROPIC_API_KEY is required unless PIPELINE_PROVIDERS_YAML is set." >&2
            exit 1
          elif [[ -n "${ANTHROPIC_API_BASE:-}" ]]; then
            cat > config/providers.yaml <<YAML
          llm:
            mode: "openai-compatible"
            api_key: "\${ANTHROPIC_API_KEY}"
            base_url: "\${ANTHROPIC_API_BASE}"
            model: "\${ANTHROPIC_MODEL}"
            timeout: 600
            routes:
              - id: "aws"
                model: "claude-5-opus-aws"
              - id: "gcp"
                model: "claude-5-opus-gcp"
              - id: "anthropic"
                model: "claude-5-opus-anthropic"

          image:
            mode: "openai-compatible"
            api_key: "\${ANTHROPIC_API_KEY}"
            endpoint: "\${ANTHROPIC_API_BASE}/v1"
            model: "gemini-3-pro-image"

          pipeline:
            base_url: "${PIPELINE_BASE_URL}"
            lookback_hours: 24
          YAML
          elif [[ -n "${GOOGLE_API_KEY:-}" ]]; then
            cat > config/providers.yaml <<YAML
          llm:
            mode: "anthropic"
            api_key: "\${ANTHROPIC_API_KEY}"
            model: "\${ANTHROPIC_MODEL}"
            timeout: 600

          image:
            mode: "native"
            api_key: "\${GOOGLE_API_KEY}"
            model: "${PIPELINE_IMAGE_MODEL}"

          pipeline:
            base_url: "${PIPELINE_BASE_URL}"
            lookback_hours: 24
          YAML
          else
            cat > config/providers.yaml <<YAML
          llm:
            mode: "anthropic"
            api_key: "\${ANTHROPIC_API_KEY}"
            model: "\${ANTHROPIC_MODEL}"
            timeout: 600

          pipeline:
            base_url: "${PIPELINE_BASE_URL}"
            lookback_hours: 24
          YAML
          fi

          python3 <<'PY'
          import os
          from pathlib import Path

          import yaml

          model = os.environ.get("ANTHROPIC_MODEL", "").strip()
          if not model:
              raise SystemExit(0)

          path = Path("config/providers.yaml")
          with path.open("r", encoding="utf-8") as handle:
              config = yaml.safe_load(handle) or {}

          llm_config = config.setdefault("llm", {})
          if llm_config.get("routes"):
              print("llm.routes configured; leaving route models unchanged.")
              raise SystemExit(0)

          previous_model = llm_config.get("model")
          llm_config["model"] = model

          with path.open("w", encoding="utf-8") as handle:
              yaml.safe_dump(config, handle, sort_keys=False)

          print(f"Configured llm.model={model} (was {previous_model})")
          PY

      # LessWrong's Vercel edge blocks by exit-IP reputation. us-atl-wg-001's
      # shared exit went bad on 2026-08-05 and LessWrong published 0 posts for
      # four straight days ("success" every time). The relay list is sorted, so
      # without state every run re-picks the same first relay. Cache the last
      # relay that passed the LessWrong probe and try it first next run.
      - name: Restore known-good Mullvad relay
        if: steps.schedule_gate.outputs.should_run == 'true' && env.MULLVAD_ACCOUNT != '' && env.PIPELINE_PROXY_URL == '' && env.REDDIT_PROXY_URL == ''
        uses: actions/cache@v4
        with:
          path: .mullvad-state
          key: mullvad-known-good-${{ github.run_id }}
          restore-keys: |
            mullvad-known-good-

      - name: Start Mullvad tunnel for hosted egress
        if: steps.schedule_gate.outputs.should_run == 'true' && env.MULLVAD_ACCOUNT != '' && env.PIPELINE_PROXY_URL == '' && env.REDDIT_PROXY_URL == ''
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          python -m pip install cryptography

          tmp_dir="$(mktemp -d)"
          settings_file="$tmp_dir/settings.conf"
          curl -fsSL \
            https://raw.githubusercontent.com/mullvad/wg-tools/c85b7ed35bdb6e0bd38fa24481819088fa6a68c5/wg-mullvad.py \
            -o "$tmp_dir/wg-mullvad.py"

          if [[ -n "${MULLVAD_WG_PRIVATE_KEY:-}" ]]; then
            umask 077
            {
              echo "[Interface]"
              echo "privatekey = ${MULLVAD_WG_PRIVATE_KEY}"
            } > "$settings_file"
          fi

          python "$tmp_dir/wg-mullvad.py" \
            --account "$MULLVAD_ACCOUNT" \
            --filter "$MULLVAD_RELAY_FILTER" \
            --active \
            --settings-file "$settings_file" \
            --output-dir "$tmp_dir/wg"

          mapfile -t wg_confs < <(find "$tmp_dir/wg" -name '*.conf' | sort)
          if [[ "${#wg_confs[@]}" -eq 0 ]]; then
            echo "No Mullvad WireGuard config generated." >&2
            exit 1
          fi

          # Preference order: last run's cached winner, then the committed
          # known-good pool (config/mullvad_good_relays.txt, from
          # scripts/sweep_mullvad_relays.py — 131 of 206 US exits passed the
          # LessWrong probe on 2026-08-09), then everything else. The probe
          # loop below still verifies whatever is picked, so a stale pool
          # degrades to more rotation, not to a blocked run.
          declare -A rank=()
          next_rank=1
          if [[ -f .mullvad-state/known_good_relay ]]; then
            cached="$(cat .mullvad-state/known_good_relay)"
            echo "Known-good relay from a previous run: $cached"
            rank["$cached"]=$(( next_rank )); (( next_rank += 1 ))
          fi
          if [[ -f config/mullvad_good_relays.txt ]]; then
            while IFS= read -r line; do
              [[ "$line" =~ ^[a-z]{2}-[a-z]{3}-wg-[0-9]+$ ]] || continue
              if [[ -z "${rank[$line]:-}" ]]; then
                rank["$line"]=$(( next_rank )); (( next_rank += 1 ))
              fi
            done < config/mullvad_good_relays.txt
          fi
          ordered=()
          while IFS= read -r conf; do
            ordered+=("${conf#*|}")
          done < <(
            for conf in "${wg_confs[@]}"; do
              relay="$(basename "$conf" .conf)"
              printf '%08d|%s\n' "${rank[$relay]:-99999999}" "$conf"
            done | sort
          )

          proxy_url="socks5h://10.64.0.1:1080"
          max_attempts="${MULLVAD_MAX_RELAY_ATTEMPTS:-6}"
          selected=""
          up_conf=""
          attempt=0
          for conf in "${ordered[@]}"; do
            (( attempt += 1 ))
            if (( attempt > max_attempts )); then
              break
            fi
            relay="$(basename "$conf" .conf)"
            sudo sed -i '/^dns[[:space:]]*=/Id' "$conf"
            sudo sed -i 's#^allowedips[[:space:]]*=.*#allowedips = 10.64.0.1/32#I' "$conf"

            if ! sudo wg-quick up "$conf"; then
              echo "Relay $relay: wg-quick up failed, trying next." >&2
              continue
            fi
            up_conf="$conf"

            proxy_ip="$(curl -fsSL --max-time 20 --proxy "$proxy_url" https://am.i.mullvad.net/ip || true)"
            if [[ -z "$proxy_ip" ]]; then
              echo "Relay $relay: SOCKS proxy gave no external IP, trying next." >&2
              sudo wg-quick down "$conf" || true
              up_conf=""
              continue
            fi

            # A blocked exit fails only at LessWrong, so probe LessWrong itself
            # (same request fingerprint as the gatherer's first-try direct path).
            if python3 scripts/probe_lesswrong.py "$proxy_url"; then
              selected="$relay"
              echo "Relay $relay ($proxy_ip): LessWrong reachable, keeping it."
              break
            fi
            echo "Relay $relay ($proxy_ip): LessWrong-blocked exit, rotating." >&2
            sudo wg-quick down "$conf" || true
            up_conf=""
          done

          if [[ -n "$selected" ]]; then
            mkdir -p .mullvad-state
            printf '%s\n' "$selected" > .mullvad-state/known_good_relay
          else
            # Every probed relay is LessWrong-blocked. The tunnel still serves
            # the rest of the pipeline's egress, so bring one up rather than
            # running naked — but say so loudly, and keep the cached relay
            # unchanged so a recovered exit is retried next run.
            echo "::warning::No Mullvad relay passed the LessWrong probe within ${max_attempts} attempts; LessWrong will likely collect 0 posts this run."
            if [[ -z "$up_conf" ]]; then
              sudo wg-quick up "${ordered[0]}"
              up_conf="${ordered[0]}"
            fi
            echo "Proceeding with relay $(basename "$up_conf" .conf) for general egress."
          fi

          {
            echo "PIPELINE_PROXY_URL=$proxy_url"
            echo "REDDIT_PROXY_URL=$proxy_url"
          } >> "$GITHUB_ENV"

          # Reddit no longer hits reddit.com directly: the gatherer collects via the
          # ScrapeCreators API (server-side unblocking, direct egress), so no .json probe
          # through Mullvad is needed. The Mullvad tunnel above still serves LLM/other egress.

      - name: Run pipeline
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PIPELINE_PROXY_URL:-}" ]]; then
            export ALL_PROXY="$PIPELINE_PROXY_URL"
            export HTTPS_PROXY="$PIPELINE_PROXY_URL"
            export HTTP_PROXY="$PIPELINE_PROXY_URL"
            export all_proxy="$PIPELINE_PROXY_URL"
            export https_proxy="$PIPELINE_PROXY_URL"
            export http_proxy="$PIPELINE_PROXY_URL"
            # ScrapeCreators (Reddit) unblocks server-side and must go direct, not through
            # the Mullvad tunnel. The gatherer sets requests trust_env=False as the primary
            # guard; this NO_PROXY entry is belt-and-suspenders.
            export NO_PROXY="localhost,127.0.0.1,::1,api.scrapecreators.com"
            export no_proxy="$NO_PROXY"
            echo "Pipeline-wide proxy is configured."
          fi

          args=(--config-dir ./config --data-dir ./data --web-dir ./web)
          if [[ -n "${TARGET_DATE_INPUT:-}" ]]; then
            args+=(--date "$TARGET_DATE_INPUT")
          fi
          if [[ -n "${RESUME_FROM_INPUT:-}" ]]; then
            args+=(--resume-from "$RESUME_FROM_INPUT")
          fi
          python3 run_pipeline.py "${args[@]}"

      - name: Validate generated report (publish gate)
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          report_date="${TARGET_DATE_INPUT:-$(TZ=America/New_York date +%F)}"
          # The pipeline can exit 0 even when Topic Detection / Executive Summary
          # failed (those phases catch their own errors and write failure sentinels
          # into summary.json). Validate the actual user-facing artifact so we never
          # publish a "generation failed" report. Exit 1 here fails the job and
          # blocks the commit; the revert step below restores the prior good data.
          python3 scripts/validate_report.py --web-dir ./web --date "$report_date"

      - name: Discard invalid generated data (keep last good report)
        if: failure() && steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # If validation (or anything before the commit) failed, do not leave a
          # broken report staged/committed. Restore tracked files and drop any
          # untracked generated output so the previously published report stands.
          read -r -a commit_paths <<< "$PIPELINE_COMMIT_PATHS"
          echo "Reverting generated paths after failure: ${commit_paths[*]}"
          git checkout -- "${commit_paths[@]}" 2>/dev/null || true
          git clean -fd -- "${commit_paths[@]}" 2>/dev/null || true

      - name: Commit generated outputs
        if: steps.schedule_gate.outputs.should_run == 'true' && env.COMMIT_OUTPUTS == 'true'
        id: commit
        shell: bash
        env:
          PIPELINE_SIGNING_KEY: ${{ secrets.PIPELINE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          read -r -a commit_paths <<< "$PIPELINE_COMMIT_PATHS"
          git add -- "${commit_paths[@]}"

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No generated output changes to commit."
            exit 0
          fi

          # Sign the commit so the deploy gate (scripts/deploy.sh) accepts it.
          # An unsigned tip on origin/main would abort the production deploy
          # (CWE-345 fix), so fail loudly here rather than stall publishing.
          if [ -z "${PIPELINE_SIGNING_KEY:-}" ]; then
            echo "ERROR: PIPELINE_SIGNING_KEY secret is empty; refusing to create an unsigned commit." >&2
            echo "  Set the PIPELINE_SIGNING_KEY secret (see deploy/README.md) so deploy.sh will accept the tip." >&2
            exit 1
          fi
          signing_key="${RUNNER_TEMP}/pipeline_signing_key"
          printf '%s\n' "$PIPELINE_SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          git config gpg.format ssh
          git config user.signingkey "$signing_key"
          git config commit.gpgsign true
          # rebase.gpgSign so the `git pull --rebase` in the Push step re-signs
          # the recreated commit (a plain rebase drops the signature). These
          # git config values persist in .git/config for that later step; the
          # key file stays in the ephemeral RUNNER_TEMP for the same reason and
          # is discarded with the runner.
          git config rebase.gpgSign true

          report_date="${TARGET_DATE_INPUT:-$(TZ=America/New_York date +%F)}"
          git commit -S -m "data: Auto-update ${report_date}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Upload generated outputs without committing
        if: steps.schedule_gate.outputs.should_run == 'true' && env.COMMIT_OUTPUTS != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-pipeline-output
          path: |
            web/data
            config/model_releases.yaml
            config/ecosystem_context.yaml
          if-no-files-found: error

      # orchestrator_result is here so a lost replay stays rebuildable. All of
      # data/ is gitignored and dies with the runner, and the replay blobs are
      # assembled in memory and never touch disk if the publish gate rejects
      # them -- which is how 2026-07-31's replay became unrecoverable. Offline
      # regeneration needs exactly cost_report + orchestrator_result, so keeping
      # both means the index can be rebuilt later (minus the stream and prompts,
      # which are genuinely memory-only). Roughly 3-6 MB; the glob matches only
      # the current run's file on a fresh checkout.
      - name: Upload pipeline diagnostics
        if: always() && steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics
          path: |
            data/llm_metrics.jsonl
            data/processed/cost_report_*.json
            data/processed/orchestrator_result_*.json
          if-no-files-found: ignore

      - name: Push generated commit
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.commit.outputs.committed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git push origin HEAD:main

      # ---------------------------------------------------------------------
      # Detection gap fix (2026-06-21): a scheduled run can exit 0 without ever
      # producing today's report. The 3 AM ET gate makes the OTHER scheduled
      # entry exit as a 7-second "success" no-op, and a run that does real work
      # but fails synthesis gets reverted by the publish gate (last good report
      # stays live) WITHOUT failing loudly. Either way the site silently serves
      # stale content. This step runs only on the nominal 3 AM ET pass (the one
      # that is SUPPOSED to publish) and asserts a `data: Auto-update <today>`
      # commit actually landed on origin/main. If not, it fails the job, which
      # triggers the failure-alert step below.
      - name: Assert today's report is published on origin/main
        if: steps.schedule_gate.outputs.should_run == 'true' && env.COMMIT_OUTPUTS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          report_date="${TARGET_DATE_INPUT:-$(TZ=America/New_York date +%F)}"
          git fetch origin main --quiet
          # Verify the actual published artifact for report_date exists on the live
          # branch. This is commit-timing independent (no false positives on same-day
          # re-dispatches or backfills where nothing new was committed), and directly
          # answers "is the site serving today's report?" If summary.json for the date
          # is absent from origin/main, the run claimed success but the site is STALE.
          artifact="web/data/${report_date}/summary.json"
          if git cat-file -e "origin/main:${artifact}" 2>/dev/null; then
            echo "Verified: ${artifact} is published on origin/main."
          else
            echo "::error::${artifact} is NOT on origin/main after a run that was \
          supposed to publish. The site is serving STALE content for ${report_date}." >&2
            echo "Recent origin/main subjects:" >&2
            git log origin/main -8 --pretty='  %h %s' >&2
            exit 1
          fi

      # Silent-degradation check (2026-07-29). The alert below fires only when the
      # JOB fails. This fires when the job SUCCEEDS and publishes bad data -- arXiv
      # returned zero on three consecutive Mondays (06-22, 06-29, 07-06) while every
      # run stayed green and collection_status said "success". Never fails the job:
      # the report is live, and a false red here would make the real alert
      # indistinguishable from noise.
      - name: Check for silently degraded sources
        if: success() && steps.schedule_gate.outputs.should_run == 'true'
        continue-on-error: true
        shell: bash
        env:
          PIPELINE_ALERT_TOKEN: ${{ secrets.PIPELINE_ALERT_TOKEN }}
          PIPELINE_ALERT_URL: ${{ vars.PIPELINE_ALERT_URL || 'https://flybotwebhook.duffplex.com/alert/pipeline' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_DATE_INPUT: ${{ inputs.target_date }}
        run: |
          set -uo pipefail
          report_date="${TARGET_DATE_INPUT:-$(TZ=America/New_York date +%F)}"
          # Exits 1 by design when it finds something; that is a finding, not a
          # job failure.
          python3 scripts/check_source_anomalies.py \
            --web-dir ./web --date "$report_date" --alert 2>&1 | tee /tmp/anomaly_check.txt
          check_rc="${PIPESTATUS[0]}"

          # GitHub-native surfacing, added 2026-08-17. The webhook POST is the
          # primary channel but it is best-effort and swallows its own errors: on
          # 2026-08-17 the arXiv outage was detected correctly, the alert fired,
          # and delivery returned HTTP 403 -- so the finding reached nobody. An
          # annotation plus a job-summary entry cannot 403; they ride the run
          # itself and reach whoever already watches the workflow.
          if [ "$check_rc" = "1" ]; then
            {
              echo "### :rotating_light: Degraded sources on ${report_date}"
              echo
              echo '```'
              cat /tmp/anomaly_check.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            while IFS= read -r line; do
              echo "::error title=Degraded source::${line#  - }"
            done < <(grep '^  - ' /tmp/anomaly_check.txt || true)
          fi

          # A failed alert delivery is itself a fault worth seeing: it means the
          # next real outage is invisible on the primary channel too.
          if grep -q 'Alert POST -> HTTP [45]' /tmp/anomaly_check.txt; then
            echo "::error title=Alert delivery failed::check_source_anomalies could not deliver to the alert ingress (see log). The degradation channel is down; rotate PIPELINE_ALERT_TOKEN or check PIPELINE_ALERT_URL."
            echo "> :warning: Alert POST to the ingress failed — the degradation channel is down." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Replay presence check (2026-07-31). Phase 6.2 swallows its own failures by
      # design -- a broken replay must never cost us the report -- which makes it the
      # only phase that can fail without turning the job red. Phases 6, 6.5 and 7 all
      # raise and exit 1; 6.2 just logs and continues. That is exactly how the 07-31
      # replay was lost: a false positive in the publish gate discarded the artifact,
      # the run stayed green, and the gap was only noticed from the empty page.
      # Annotates, never fails: the report is live and correct without the replay.
      - name: Check the replay artifact was published
        if: success() && steps.schedule_gate.outputs.should_run == 'true'
        continue-on-error: true
        shell: bash
        env:
          TARGET_DATE_INPUT: ${{ inputs.target_date }}
        run: |
          set -uo pipefail
          report_date="${TARGET_DATE_INPUT:-$(TZ=America/New_York date +%F)}"
          if [[ -f "web/data/${report_date}/replay-index.json" ]]; then
            echo "Verified: replay-index.json present for ${report_date}."
          else
            echo "::warning title=Replay artifact missing::Phase 6.2 produced no \
          replay-index.json for ${report_date}. The report itself is unaffected. Grep \
          this log for 'PHASE 6.2 FAILED' for the cause. The pipeline-diagnostics \
          artifact carries cost_report + orchestrator_result, which is what \
          generators/replay_generator.py needs to rebuild the index offline."
          fi

      # Proactive failure alert (2026-06-21). Fires on ANY failure of a run that
      # was supposed to publish (RED synthesis, publish-gate revert, or the
      # commit-landed assertion above). POSTs to the graph-webhooks alert ingress
      # (Cloudflare tunnel -> LaunchDaemon on Ryan's Mac mini), which wakes FlyBot
      # with a system event in under a minute instead of the site sitting stale
      # for hours. Bearer-authenticated; the endpoint fails closed without it.
      # best-effort: never let the alert itself fail the job or leak the token.
      - name: Alert on pipeline failure
        if: failure() && steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        env:
          PIPELINE_ALERT_TOKEN: ${{ secrets.PIPELINE_ALERT_TOKEN }}
          PIPELINE_ALERT_URL: ${{ vars.PIPELINE_ALERT_URL || 'https://flybotwebhook.duffplex.com/alert/pipeline' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [[ -z "${PIPELINE_ALERT_TOKEN:-}" ]]; then
            echo "PIPELINE_ALERT_TOKEN not set; skipping alert POST (configure the repo secret)."
            exit 0
          fi
          report_date="${TARGET_DATE_INPUT:-$(TZ=America/New_York date +%F)}"
          payload="$(python3 - "$report_date" "$RUN_URL" <<'PY'
          import json, sys
          print(json.dumps({
              "status": "failure",
              "report_date": sys.argv[1],
              "reason": "daily-pipeline.yml failed before today's report published",
              "run_url": sys.argv[2],
          }))
          PY
          )"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST "$PIPELINE_ALERT_URL" \
            -H "Authorization: Bearer ${PIPELINE_ALERT_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$payload" || true)"
          echo "Alert POST -> HTTP ${code:-no-response}"
          # Do not fail the job on alert delivery problems; the run is already red.
          exit 0
